# v++ link config: 3-branch AIE feature graph + PL data movers on VCK190 base.
#
# Datapath (Arch A validation, full 8-feature): DDR -> 3x mm2s -> AIE PLIO
#   { motion: FIR->stats | breathing: windowed-DFT | phase-var: stats } ->
#   3x s2mm -> DDR. Matches the 3-branch src/graph.cpp (libadf.a), 6 PLIO ports.

[connectivity]
# three CUs of each data mover (one per branch)
nk=mm2s:3:mm2s_mot.mm2s_brt.mm2s_phs
nk=s2mm:3:s2mm_mot.s2mm_brt.s2mm_phs

# bind every AXI4-MM port to the platform DDR
sp=mm2s_mot.mem:DDR
sp=mm2s_brt.mem:DDR
sp=mm2s_phs.mem:DDR
sp=s2mm_mot.mem:DDR
sp=s2mm_brt.mem:DDR
sp=s2mm_phs.mem:DDR

# AXI4-Stream: DDR movers <-> AIE PLIO (names from src/graph.cpp)
stream_connect=mm2s_mot.s:ai_engine_0.PLIO_in
stream_connect=mm2s_brt.s:ai_engine_0.PLIO_brt_in
stream_connect=mm2s_phs.s:ai_engine_0.PLIO_phase_in
stream_connect=ai_engine_0.PLIO_out:s2mm_mot.s
stream_connect=ai_engine_0.PLIO_brt_out:s2mm_brt.s
stream_connect=ai_engine_0.PLIO_phase_out:s2mm_phs.s
