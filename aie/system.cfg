# v++ link config: AIE feature graph + PL data movers on the VCK190 base platform.
#
# Datapath (Arch A validation path): DDR -> mm2s -> AIE PLIO_in -> FIR -> stats
#   -> AIE PLIO_out -> s2mm -> DDR. mm2s/s2mm are the HLS kernels in ./pl.
# The AIE graph is instanced as ai_engine_0; its PLIO ports keep their logical
# names (PLIO_in / PLIO_out). Both data movers bind to the DDR memory SP tag.

[connectivity]
# instantiate one CU of each data mover
nk=mm2s:1:mm2s
nk=s2mm:1:s2mm

# bind the AXI4-MM ports to the platform DDR
sp=mm2s.mem:DDR
sp=s2mm.mem:DDR

# AXI4-Stream: mm2s -> AIE input, AIE output -> s2mm
stream_connect=mm2s.s:ai_engine_0.PLIO_in
stream_connect=ai_engine_0.PLIO_out:s2mm.s

# PL kernels run on the platform default clock (index 2, 312.5 MHz). Uncomment
# to force a slower clock if PL timing does not close:
# [clock]
# freqHz=156250000:mm2s.ap_clk,s2mm.ap_clk
